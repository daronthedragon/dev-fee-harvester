name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, for the on-chain check: the constants are read from deployed
    # programs, so a program upgrade is something to hear about.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              os: ubuntu-latest,
              node: '20',
              label: 'ubuntu · node 20',
              engines: 'chromium firefox webkit',
            }
          - {
              os: ubuntu-latest,
              node: '22',
              label: 'ubuntu · node 22',
              engines: 'chromium firefox webkit',
            }
          # Windows is here for path and platform handling, which is where every
          # portability bug in this project showed up first. Engine coverage is
          # the Ubuntu legs' job, so this one runs Chromium alone — Windows
          # minutes bill at double, and a second copy of the same three engines
          # buys nothing.
          - { os: windows-latest, node: '22', label: 'windows · node 22', engines: 'chromium' }
    env:
      # Keep the browsers inside the workspace so one cache path and one key
      # work identically on both runners.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Derived from matrix.engines rather than repeated as its own matrix
      # field, so the cache key cannot drift from what actually gets installed.
      - name: Derive browser cache key
        shell: bash
        env:
          ENGINES: ${{ matrix.engines }}
        run: echo "ENGINE_KEY=$(echo "$ENGINES" | tr ' ' '-')" >> "$GITHUB_ENV"

      # Playwright's Firefox and WebKit builds are ~105MB and change only with
      # the playwright-core version, so they are worth caching. The engine list
      # is part of the key: without it a leg that runs one engine restores, and
      # then re-saves, whatever some other leg happened to install.
      - name: Cache browsers
        uses: actions/cache@v5
        with:
          path: pw-browsers
          key: playwright-${{ runner.os }}-${{ env.ENGINE_KEY }}-${{ hashFiles('package-lock.json') }}
          # A lockfile bump should top up the existing browsers, not refetch
          # every one of them. Scoped to the same engine list.
          restore-keys: |
            playwright-${{ runner.os }}-${{ env.ENGINE_KEY }}-

      # --with-deps installs system libraries and is Linux-only.
      - name: Install browsers
        shell: bash
        env:
          ENGINES: ${{ matrix.engines }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright-core install --with-deps $ENGINES
          else
            npx playwright-core install $ENGINES
          fi

      # The suite skips rather than fails when an engine is missing, so a
      # broken install would otherwise pass quietly. Skipping an engine this
      # leg was never asked to run is fine; anything else is not.
      - name: Test
        shell: bash
        env:
          ENGINES: ${{ matrix.engines }}
        run: |
          BROWSER_ENGINES=$(echo "$ENGINES" | tr ' ' ',')
          export BROWSER_ENGINES
          echo "engines for this leg: $BROWSER_ENGINES"

          set -o pipefail
          npm test 2>&1 | tee test-output.txt
          set +o pipefail

          skipped=$(grep -E '^# skipped' test-output.txt | awk '{print $3}')
          # grep exits non-zero when it matches nothing, which is the happy
          # path here, so it must not take the step down with it.
          unexpected=$(grep '# SKIP' test-output.txt | grep -vc 'not in BROWSER_ENGINES' || true)
          echo "skipped: ${skipped:-unknown} (unexpected: ${unexpected:-0})"
          if [ "${unexpected:-1}" != "0" ]; then
            echo "::error::${unexpected} test(s) skipped for a reason other than this leg's engine selection"
            grep '# SKIP' test-output.txt | grep -v 'not in BROWSER_ENGINES' | head -5
            exit 1
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

  onchain:
    name: on-chain constants
    runs-on: ubuntu-latest
    # Hits a public RPC, so it is kept off the push path where rate limiting
    # would show up as a broken build rather than as news.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Re-derive every constant from the deployed programs
        run: npm run verify:onchain

  attribution:
    name: no AI attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          pattern='co-authored-by:.*(claude|cursor|copilot|codex|devin|aider|gemini|chatgpt|openai|anthropic)|generated with.*(claude|cursor|copilot)'
          if git log --pretty=%B | grep -inE "$pattern"; then
            echo "::error::AI attribution found in a commit message"
            exit 1
          fi
          echo "clean: no AI attribution across $(git rev-list --count HEAD) commits"
